name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mcp
      - name: MCP 2026-07-28 HTTP integration and security tests
        run: npm run test:mcp:http
      - name: MCP and browser live synchronization
        run: npm run test:live
      - run: npm run build
      - run: npm run test:composer
      - name: Test built web studio and shared API
        run: npm run test:built
      - name: Visual editor browser smoke tests
        env:
          STUDIO_THEME_SCREENSHOTS: .artifacts/studio
        run: npm run test:e2e
      - name: Studio light and dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-themes
          path: .artifacts/studio-*.png
          if-no-files-found: ignore
      - run: npm run export:html -- examples/basic.json /tmp/basic-presentation.html

  windows:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:composer
      - name: Windows production browser smoke test
        run: npm run test:built
      - name: Windows MCP client test
        run: npm run test:mcp
      - name: Windows MCP HTTP v2 client test
        run: npm run test:mcp:http
