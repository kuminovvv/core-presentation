<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Core Presentation — Studio</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">C<span>●</span></span><span>core<span class="brand-muted">/presentation</span></span><span class="tag">ALPHA</span></div>
        <div class="project-switcher">
          <select id="project-picker" aria-label="Проект"><option value="">Локальный пример</option></select>
          <button id="new-project" type="button" title="Новая презентация">＋</button>
          <details id="project-actions" class="project-actions" hidden>
            <summary title="Действия с проектом">•••</summary>
            <div class="project-actions-menu">
              <button type="button" id="duplicate-project">Создать копию</button>
              <button type="button" id="archive-project">Архивировать проект</button>
            </div>
          </details>
        </div>
        <div class="project-name"><input id="project-title" aria-label="Название презентации" maxlength="140" /></div>
        <div class="toolbar right">
          <button id="undo" title="Отменить (Ctrl+Z)">↶</button>
          <button id="redo" title="Повторить (Ctrl+Shift+Z)">↷</button>
          <span class="separator"></span>
          <label for="import-file" class="button secondary">Импорт JSON</label>
          <input id="import-file" type="file" accept=".json,application/json" hidden />
          <span id="sync-status" data-state="local" role="status" aria-live="polite">Локальный пример</span>
          <button id="sync-remote" class="secondary" type="button" hidden>Версия агента</button>
          <button id="sync-copy" class="secondary" type="button" hidden>Сохранить копию</button>
          <button id="save" class="secondary">Сохранить JSON</button>
          <button id="export-html" class="secondary" title="Скачать автономную HTML-презентацию">Экспорт HTML</button>
          <button id="export-pdf" class="secondary" title="Скачать PDF со всеми слайдами">PDF</button>
          <button id="preview" class="primary">▶ Предпросмотр</button>
        </div>
      </header>
      <div class="app-body">
        <aside class="sidebar">
          <div class="panel-head"><span>СЛАЙДЫ</span>
            <div class="sidebar-buttons">
              <button id="add-slide" title="Добавить пустой слайд">＋</button>
              <details class="layout-menu">
                <summary title="Готовые макеты слайдов">▦</summary>
                <div class="layout-options">
                  <button type="button" data-layout="title">Титульный</button>
                  <button type="button" data-layout="section">Раздел</button>
                  <button type="button" data-layout="two-columns">Две колонки</button>
                  <button type="button" data-layout="quote">Цитата</button>
                  <button type="button" data-layout="blank">Пустой слайд</button>
                </div>
              </details>
            </div>
          </div>
          <div id="slide-list" class="slide-list"></div>
          <div class="sidebar-bottom">OPEN FORMAT · HTML/CSS/JS</div>
        </aside>
        <main class="workspace">
          <div class="tools">
            <span class="tools-label">Добавить</span>
            <button id="add-text">T <span>Текст</span></button>
            <button id="add-shape">▢ <span>Фигура</span></button>
            <button id="add-image">▧ <span>Изображение</span></button>
            <button id="add-html">⌘ <span>HTML / JS</span></button>
            <span class="separator"></span>
            <button id="timeline-toggle" aria-expanded="false" title="Показать временную шкалу анимаций">◷ <span>Анимации</span></button>
            <div class="tools-spacer"></div>
            <span class="hint">Shift · множественный выбор</span>
          </div>
          <div id="stage-shell" class="stage-shell">
            <div id="editor-stage" class="editor-stage" aria-label="Холст слайда"></div>
          </div>
          <section id="timeline-panel" class="timeline-panel" aria-label="Временная шкала анимаций" hidden>
            <div class="timeline-header"><span>АНИМАЦИИ СЛАЙДА</span><span>0 мс</span><span>500</span><span>1000</span><span>1500</span><span>2000+</span></div>
            <div id="timeline-rows" class="timeline-rows"></div>
          </section>
          <div class="status"><span id="slide-counter"></span><span>1600 × 900 · 16:9</span><span id="zoom"></span></div>
        </main>
        <aside class="inspector">
          <div class="panel-head">СВОЙСТВА</div>
          <div id="properties" class="properties"></div>
        </aside>
      </div>
    </div>
    <div id="preview-overlay" class="preview-overlay" hidden>
      <div id="preview-surface" class="preview-surface"></div>
      <div class="preview-controls">
        <button id="preview-back">←</button>
        <span id="preview-counter">1 / 1</span>
        <button id="preview-next">→</button>
        <button id="preview-fullscreen" type="button" title="Показать на весь экран (F)">⛶ Полный экран</button>
        <button id="preview-close" class="preview-close">✕ Закрыть</button>
      </div>
    </div>
    <dialog id="create-project-dialog" class="project-dialog">
      <form id="create-project-form">
        <h2>Новая презентация</h2>
        <p>Проект будет доступен в редакторе и через MCP.</p>
        <label>Название<input id="new-project-title" required maxlength="300" placeholder="Моя презентация"></label>
        <label>Имя папки<input id="new-project-name" required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}" maxlength="64" placeholder="my-presentation"></label>
        <p id="project-error" class="project-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel-project" type="button">Отмена</button>
          <button id="confirm-project" type="submit">Создать проект</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
